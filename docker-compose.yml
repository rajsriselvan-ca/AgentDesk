services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentdesk
    ports:
      - '5432:5432'
    volumes:
      - agentdesk-data:/var/lib/postgresql/data
      # Creates the second database the test suite needs.
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agentdesk']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/agentdesk
      PORT: '3001'
      NODE_ENV: production
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGIN: http://localhost:8080
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
    # Migrations run here rather than in a separate job so a fresh
    # `docker compose up` is genuinely one command.
    command: >
      sh -c "node --import tsx /app/packages/db/src/migrate.ts &&
             node --import tsx /app/packages/db/src/seed.ts &&
             node /app/apps/api/dist/server.js"

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  agentdesk-data:
